[workspace]
authors = ["Anatoly Vitold Stankyavichyus <anatolyvitold@outlook.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "apn_mojo"
platforms = ["linux-64", "osx-arm64"]
version = "1.0.0"

[tasks]
report = "python3 tests/benchmarks/report.py"
docs-test = "python3 scripts/verify_docs_examples.py"
example = "mojo run -I src --Werror docs/examples/integer_tour.mojo"
test = "python3 tests/run.py"

[dependencies]
mojo = "==1.1.0"

[feature.comparison.dependencies]
python = "3.13.*"

[feature.comparison.pypi-dependencies]
mpmath = "==1.4.1"
gmpy2 = "==2.3.1"
python-flint = "==0.9.0"

[feature.docs.dependencies]
python = "3.14.*"
mkdocs = "==1.6.1"
pygments = "==2.19.2"
pymdown-extensions = "==12.1"

[feature.docs.tasks]
docs-build = "python -m mkdocs build --strict"
docs-serve = "python -m mkdocs serve"
docs-check = "python scripts/check_docs.py"

[environments]
comparison = { features = ["comparison"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
